trigger:
- part2

resources:
- repo: self

pool:
  vmImage: ubuntu-latest

variables:
  image: "rphredacr.azurecr.io/pytest:v1"
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    steps:
    - task: Docker@2
      displayName: Build the image
      inputs:
        command: build
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(tag)

- stage: Test
  dependsOn: Build
  jobs:
  - job: Test
    steps:
    - task: Test@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: rphredacr
    - script: |
        docker pull mycompany.azurecr.io/my-app:$(tag)
        docker run --rm mycompany.azurecr.io/my-app:$(tag) <your-test-command>
      displayName: Test image
